input = "/media/in"
output = "/media/out"
profile = "hevc"
scan_secs = 10
idle_secs = 60
extensions = ["mp4", "mkv", "mov", "avi", "m4v", "ts", "webm"]
ignore = ["*.part", "sample*"]
output_name = "{name}"
jobs = 1
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
delete_source = false
log_file = "transcodarr.jsonl"

[web]
enabled = true
host = "127.0.0.1"
port = 8686

[folders]
anime = "av1"

[profiles.hevc]
ext = "mkv"
args = ["-map", "0:V", "-map", "0:a?", "-map", "0:s?", "-map", "0:t?", "-c:t", "copy", "-c:v", "libx265", "-crf", "24", "-preset", "medium", "-c:a", "copy", "-c:s", "copy"]
skip_codecs = ["hevc", "av1"]

[profiles.h264]
ext = "mp4"
args = ["-map", "0:V", "-map", "0:a?", "-c:v", "libx264", "-crf", "21", "-c:a", "aac", "-b:a", "160k", "-movflags", "+faststart"]
ignore_errors = false

[profiles.av1]
ext = "mkv"
input_args = ["-hwaccel", "cuda"]
args = ["-map", "0:V", "-map", "0:a?", "-map", "0:s?", "-map", "0:t?", "-c:t", "copy", "-c:v", "av1_nvenc", "-preset", "p5", "-tune", "hq", "-rc", "vbr", "-cq", "30", "-b:v", "0", "-c:a", "copy", "-c:s", "copy"]
skip_codecs = ["av1"]
