[package]
name = "transcodarr"
version = "0.1.0"
edition = "2024"
description = "Watch a folder and transcode new videos with ffmpeg"
license = "AGPL-3.0-only"
repository = "https://github.com/aaronburt/transcodarr"
readme = "README.md"
keywords = ["ffmpeg", "transcode", "video", "watch-folder", "nvenc"]
categories = ["command-line-utilities", "multimedia::video"]
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[profile.release]
strip = true
lto = true
