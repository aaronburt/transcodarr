name: Release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

env:
  CARGO_TERM_COLOR: always
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  VERSION: ${{ github.event_name == 'push' && github.ref_name || 'edge' }}

jobs:
  binaries:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="transcodarr-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md transcodarr.example.toml "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/transcodarr.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/transcodarr" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            transcodarr-*.tar.gz
            transcodarr-*.zip

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: Publish stable release
        if: github.event_name == 'push'
        run: |
          awk -v v="[${VERSION#v}]" '/^## /{p = index($0, v) == 4; next} /^\[/{p = 0} p' CHANGELOG.md > notes.md
          gh release create "$VERSION" dist/* --title "$VERSION" --notes-file notes.md
      - name: Publish edge prerelease
        if: github.event_name == 'workflow_run'
        run: |
          gh release delete edge --cleanup-tag --yes || true
          gh release create edge dist/* --prerelease --latest=false --target "$SHA" \
            --title "Edge (${SHA::7})" \
            --notes "Built automatically from \`main\` at ${SHA}. Untested beyond CI; use the latest versioned release for stability."

  image:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=${{ github.event_name == 'push' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_run' }}
          labels: org.opencontainers.image.revision=${{ env.SHA }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
