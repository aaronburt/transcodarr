name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      number: ${{ steps.next.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - id: next
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          elif git tag --points-at "$SHA" | grep -qE '^v[0-9]+\.[0-9]+$'; then
            echo "$SHA is already released"
            exit 0
          else
            last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            if [ -z "$last" ]; then
              tag=v0.1
            else
              major=${last#v}; major=${major%%.*}
              minor=${last##*.}
              tag="v$major.$((minor + 1))"
            fi
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a vMAJOR.MINOR tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  binaries:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    env:
      TRANSCODARR_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="transcodarr-${{ needs.version.outputs.tag }}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md transcodarr.example.toml "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/transcodarr.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/transcodarr" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: |
            transcodarr-*.tar.gz
            transcodarr-*.zip

  image:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: TRANSCODARR_VERSION=${{ needs.version.outputs.number }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.number }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.number }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS
      - run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --generate-notes \
            --notes "Docker: \`ghcr.io/$GITHUB_REPOSITORY:${TAG#v}\`"
